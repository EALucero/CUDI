version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: backend:latest
    env_file: .env
    ports:
      - "8080:3000"
    volumes:
      - backend-storage:/app/apps/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
      
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    image: frontend:latest
    env_file: .env
    ports:
      - "8081:5173"

volumes:
  pgdata:
  backend-storage:
